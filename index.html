<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#050607">
  <title>JR Gestão</title>

  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=jr-wrapper-v40">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=jr-wrapper-v40">
  <link rel="preload" href="./logo-jr-gestao.png?v=40" as="image" type="image/png">

  <style>
    /* JR_GESTAO_WRAPPER_METAL_V40 */

    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #050607;
      --jr-vh: 100dvh;
      --jr-mx: 50%;
      --jr-my: 46%;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050607;
      overscroll-behavior: none;
    }

    body {
      min-height: var(--jr-vh, 100dvh);
    }

    #panel {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: var(--jr-vh, 100dvh);
      border: 0;
      background: #050607;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .28s ease;
    }

    #panel.is-ready {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #jr-loader-v40 {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: var(--jr-vh, 100dvh);
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      overflow: hidden;
      color: #f4f6f7;
      background:
        radial-gradient(circle at var(--jr-mx) var(--jr-my), rgba(223,229,232,.09), transparent 27rem),
        radial-gradient(circle at 15% 18%, rgba(113,121,126,.10), transparent 28rem),
        linear-gradient(145deg, #030405 0%, #0a0c0e 48%, #030405 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity .38s ease, visibility .38s ease;
      isolation: isolate;
    }

    #jr-loader-v40.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .jr-metal-v40 {
      position: absolute;
      inset: -16%;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
      filter: saturate(.25) contrast(1.05);
    }

    .jr-metal-v40::before,
    .jr-metal-v40::after,
    .jr-metal-wave-v40 {
      content: "";
      position: absolute;
      border-radius: 48% 52% 55% 45% / 45% 56% 44% 55%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.34), transparent 10%),
        radial-gradient(circle at 62% 48%, rgba(158,166,170,.17), transparent 28%),
        radial-gradient(circle at 44% 68%, rgba(13,15,17,.92), transparent 48%),
        linear-gradient(125deg, rgba(239,243,245,.12), rgba(18,21,23,.24) 38%, rgba(214,219,221,.11) 70%, rgba(3,4,5,.08));
      box-shadow:
        inset 0 0 80px rgba(255,255,255,.055),
        0 0 100px rgba(0,0,0,.55);
      opacity: .58;
      will-change: transform;
      transform: translate3d(0,0,0);
    }

    .jr-metal-v40::before {
      width: min(78vw, 940px);
      height: min(58vw, 680px);
      left: -12%;
      top: -14%;
      animation: jrMetalA40 14s ease-in-out infinite alternate;
    }

    .jr-metal-v40::after {
      width: min(72vw, 860px);
      height: min(62vw, 720px);
      right: -14%;
      bottom: -22%;
      animation: jrMetalB40 17s ease-in-out infinite alternate;
    }

    .jr-metal-wave-v40 {
      width: min(58vw, 720px);
      height: min(34vw, 430px);
      left: 28%;
      top: 36%;
      opacity: .32;
      animation: jrMetalC40 19s ease-in-out infinite alternate;
    }

    .jr-card-v40 {
      position: relative;
      width: min(91vw, 540px);
      padding: clamp(24px, 4vw, 38px);
      border: 1px solid rgba(210,216,219,.20);
      border-radius: 26px;
      text-align: center;
      background:
        linear-gradient(150deg, rgba(29,33,36,.80), rgba(7,9,11,.88));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.055),
        0 26px 76px rgba(0,0,0,.54);
      overflow: hidden;
    }

    .jr-card-v40::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 18%, rgba(255,255,255,.055) 42%, transparent 63%);
      transform: translate3d(-70%,0,0);
      animation: jrCardReflection40 5.8s ease-in-out infinite;
    }

    .jr-logo-wrap-v40 {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: clamp(130px, 24vw, 205px);
      margin: -16px auto -4px;
      overflow: hidden;
    }

    .jr-logo-v40 {
      display: block;
      width: min(100%, 420px);
      max-height: 230px;
      object-fit: contain;
      filter:
        drop-shadow(0 13px 24px rgba(0,0,0,.34))
        drop-shadow(0 0 9px rgba(255,255,255,.05));
      user-select: none;
      -webkit-user-drag: none;
    }

    .jr-title-v40 {
      margin: 4px 0 6px;
      color: #f3f5f6;
      font-size: clamp(21px, 4.5vw, 28px);
      font-weight: 800;
      letter-spacing: .035em;
    }

    .jr-message-v40 {
      min-height: 24px;
      margin: 0;
      color: #bfc5c8;
      font-size: clamp(14px, 3.6vw, 16px);
      line-height: 1.5;
    }

    .jr-progress-v40 {
      position: relative;
      width: min(100%, 390px);
      height: 6px;
      margin: 24px auto 12px;
      overflow: hidden;
      border: 1px solid rgba(211,217,220,.18);
      border-radius: 999px;
      background: rgba(0,0,0,.62);
      box-shadow: inset 0 1px 4px rgba(0,0,0,.85);
      transform: translateZ(0);
    }

    .jr-progress-v40::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      border-radius: inherit;
      background:
        linear-gradient(90deg,
          transparent 0%,
          rgba(151,158,162,.45) 20%,
          rgba(247,249,250,.95) 48%,
          rgba(161,168,172,.48) 74%,
          transparent 100%);
      box-shadow: 0 0 10px rgba(235,239,241,.18);
      will-change: transform, opacity;
      animation: jrProgress40 1.45s linear infinite;
      -webkit-animation: jrProgress40 1.45s linear infinite;
      transform: translate3d(-120%,0,0);
    }

    .jr-note-v40 {
      display: block;
      min-height: 18px;
      color: #858d92;
      font-size: 12px;
      letter-spacing: .02em;
    }

    .jr-retry-v40 {
      display: none;
      width: min(100%, 300px);
      min-height: 46px;
      margin: 19px auto 0;
      padding: 11px 18px;
      border: 1px solid rgba(219,224,226,.25);
      border-radius: 13px;
      color: #f1f3f4;
      font: inherit;
      font-weight: 760;
      background: linear-gradient(145deg, rgba(54,60,64,.96), rgba(18,21,23,.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      cursor: pointer;
      touch-action: manipulation;
    }

    .jr-retry-v40.is-visible {
      display: block;
    }

    @keyframes jrProgress40 {
      0% {
        transform: translate3d(-120%,0,0);
        opacity: .38;
      }
      44% {
        opacity: 1;
      }
      100% {
        transform: translate3d(345%,0,0);
        opacity: .48;
      }
    }

    @keyframes jrMetalA40 {
      from { transform: translate3d(-3%, -2%, 0) rotate(-4deg) scale(.98); }
      to   { transform: translate3d(7%, 6%, 0) rotate(6deg) scale(1.07); }
    }

    @keyframes jrMetalB40 {
      from { transform: translate3d(3%, 7%, 0) rotate(7deg) scale(1.04); }
      to   { transform: translate3d(-7%, -3%, 0) rotate(-5deg) scale(.97); }
    }

    @keyframes jrMetalC40 {
      from { transform: translate3d(-5%, 4%, 0) rotate(-3deg) scale(.96); }
      to   { transform: translate3d(6%, -5%, 0) rotate(5deg) scale(1.05); }
    }

    @keyframes jrCardReflection40 {
      0%, 55% { transform: translate3d(-75%,0,0); opacity: 0; }
      72%     { opacity: .75; }
      100%    { transform: translate3d(90%,0,0); opacity: 0; }
    }

    @media (max-width: 900px) {
      #jr-loader-v40 {
        place-items: center;
        min-height: var(--jr-vh, 100dvh);
        padding-top: max(15px, env(safe-area-inset-top));
        padding-bottom: max(15px, env(safe-area-inset-bottom));
      }

      .jr-card-v40 {
        width: min(93vw, 470px);
        padding: 23px 20px 25px;
        border-radius: 22px;
      }

      .jr-logo-wrap-v40 {
        min-height: 145px;
        margin-top: -12px;
      }

      .jr-logo-v40 {
        width: min(100%, 350px);
        max-height: 185px;
      }

      .jr-progress-v40::before {
        animation: jrProgress40 1.35s linear infinite !important;
        -webkit-animation: jrProgress40 1.35s linear infinite !important;
        animation-play-state: running !important;
        -webkit-animation-play-state: running !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .jr-metal-v40::before,
      .jr-metal-v40::after,
      .jr-metal-wave-v40,
      .jr-card-v40::before {
        animation: none !important;
      }

      .jr-progress-v40::before {
        animation: jrProgress40 1.8s linear infinite !important;
        -webkit-animation: jrProgress40 1.8s linear infinite !important;
      }
    }
  </style>
</head>
<body>
  <iframe
    id="panel"
    title="Painel JR Gestão"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="jr-loader-v40" role="status" aria-live="polite" aria-label="Carregando JR Gestão">
    <div class="jr-metal-v40" aria-hidden="true">
      <i class="jr-metal-wave-v40"></i>
    </div>

    <main class="jr-card-v40">
      <div class="jr-logo-wrap-v40">
        <img
          class="jr-logo-v40"
          src="./logo-jr-gestao.png?v=40"
          alt="JR Gestão"
          width="1536"
          height="1024"
          decoding="async"
          fetchpriority="high"
        >
      </div>

      <h1 class="jr-title-v40">JR GESTÃO</h1>
      <p id="jr-message-v40" class="jr-message-v40">Conectando ao painel...</p>

      <div class="jr-progress-v40" role="progressbar" aria-label="Carregando o painel"></div>
      <small id="jr-note-v40" class="jr-note-v40">Aguarde alguns instantes</small>

      <button id="jr-retry-v40" class="jr-retry-v40" type="button">
        TENTAR NOVAMENTE
      </button>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      const panel = document.getElementById('panel');
      const loader = document.getElementById('jr-loader-v40');
      const message = document.getElementById('jr-message-v40');
      const note = document.getElementById('jr-note-v40');
      const retry = document.getElementById('jr-retry-v40');

      let currentTarget = '';
      let hardReleaseTimer = 0;
      let fetchController = null;
      let finished = false;

      const mobileMedia = window.matchMedia('(max-width: 900px)');
      const mobileUserAgent =
        /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(navigator.userAgent);

      const isMobile = () => mobileMedia.matches || mobileUserAgent;

      function updateViewportHeight() {
        const height = Math.round(
          window.visualViewport?.height ||
          window.innerHeight ||
          document.documentElement.clientHeight ||
          800
        );

        document.documentElement.style.setProperty('--jr-vh', `${height}px`);
      }

      function updatePointer(event) {
        const width = Math.max(1, window.innerWidth);
        const height = Math.max(1, window.innerHeight);
        const x = Math.max(0, Math.min(100, (event.clientX / width) * 100));
        const y = Math.max(0, Math.min(100, (event.clientY / height) * 100));

        document.documentElement.style.setProperty('--jr-mx', `${x}%`);
        document.documentElement.style.setProperty('--jr-my', `${y}%`);
      }

      function targetFile() {
        return `./target.json?v=${Date.now()}`;
      }

      function setLoadingText(text, secondary = 'Aguarde alguns instantes') {
        message.textContent = text;
        note.textContent = secondary;
      }

      function showLoader(text = 'Conectando ao painel...') {
        finished = false;
        loader.classList.remove('is-leaving');
        retry.classList.remove('is-visible');
        setLoadingText(text);
      }

      function revealPanel(immediate = false) {
        if (finished) return;

        finished = true;
        clearTimeout(hardReleaseTimer);

        panel.classList.add('is-ready');

        if (immediate) {
          loader.remove();
          return;
        }

        loader.classList.add('is-leaving');
        window.setTimeout(() => loader.remove(), 430);
      }

      function showFailure(text) {
        clearTimeout(hardReleaseTimer);
        finished = false;
        loader.classList.remove('is-leaving');
        setLoadingText(text, 'Verifique o servidor e tente novamente');
        retry.classList.add('is-visible');
      }

      async function fetchTarget() {
        fetchController?.abort();
        fetchController = new AbortController();

        const timeout = window.setTimeout(() => fetchController.abort(), 8500);

        try {
          const response = await fetch(targetFile(), {
            cache: 'no-store',
            signal: fetchController.signal,
            headers: { 'Accept': 'application/json' },
          });

          if (!response.ok) throw new Error('Destino indisponível');

          const data = await response.json();
          const target = String(data.url || '').trim().replace(/\/+$/, '');

          if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(target)) {
            throw new Error('Túnel inválido');
          }

          return target;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function openPanel(force = false) {
        showLoader(force ? 'Reconectando ao painel...' : 'Conectando ao painel...');

        try {
          const target = await fetchTarget();
          currentTarget = target;

          /*
            No celular, abre o túnel diretamente. Isso elimina o iframe como
            terceiro domínio, evita travamento de login/localStorage e impede
            que o navegador fique preso na tela azul do wrapper.
          */
          if (isMobile()) {
            setLoadingText('Abrindo o painel...', 'Você será redirecionado em instantes');

            const destination =
              `${target}/?jr_fixed_link=1&v=${Date.now()}`;

            window.setTimeout(() => {
              window.location.replace(destination);
            }, 180);

            return;
          }

          panel.classList.remove('is-ready');
          panel.src = `${target}/?jr_wrapper=40&v=${Date.now()}`;

          clearTimeout(hardReleaseTimer);
          hardReleaseTimer = window.setTimeout(() => {
            /*
              Nunca mantém o desktop preso eternamente no carregamento.
              Mesmo se o evento load falhar, revela o iframe.
            */
            revealPanel();
          }, 9000);
        } catch (error) {
          showFailure(
            error?.name === 'AbortError'
              ? 'O servidor demorou para responder.'
              : 'O painel está desligado ou ainda está iniciando.'
          );
        }
      }

      panel.addEventListener('load', () => {
        window.setTimeout(() => revealPanel(), 220);
      });

      retry.addEventListener('click', () => openPanel(true));

      window.visualViewport?.addEventListener('resize', updateViewportHeight, { passive: true });
      window.addEventListener('resize', updateViewportHeight, { passive: true });
      window.addEventListener('orientationchange', () => {
        window.setTimeout(updateViewportHeight, 120);
        window.setTimeout(updateViewportHeight, 420);
      }, { passive: true });

      window.addEventListener('pointermove', updatePointer, { passive: true });

      window.addEventListener('pageshow', (event) => {
        updateViewportHeight();

        if (event.persisted && !isMobile() && panel.src) {
          revealPanel(true);
        }
      });

      /*
        Atualiza o destino no desktop. No celular o usuário já está navegando
        diretamente no túnel e basta reabrir o link fixo caso o túnel mude.
      */
      window.setInterval(async () => {
        if (isMobile()) return;

        try {
          const target = await fetchTarget();

          if (target !== currentTarget) {
            currentTarget = target;
            showLoader('Reconectando ao painel...');
            panel.classList.remove('is-ready');
            panel.src = `${target}/?jr_wrapper=40&v=${Date.now()}`;

            clearTimeout(hardReleaseTimer);
            hardReleaseTimer = window.setTimeout(() => revealPanel(), 9000);
          }
        } catch (_error) {}
      }, 30000);

      updateViewportHeight();
      openPanel();
    })();
  </script>
</body>
</html>
