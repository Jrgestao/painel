<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>JR Gestão</title>
  <!-- JR_FRAME_WRAPPER_V2 -->
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07111f;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
    }
    #panel {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #07111f;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 14%, rgba(42,112,211,.25), transparent 35rem),
        #07111f;
      color: #eef6ff;
      text-align: center;
      transition: opacity .25s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .card {
      width: min(92vw, 460px);
      padding: 34px;
      border: 1px solid rgba(151,182,224,.15);
      border-radius: 24px;
      background: rgba(13,27,48,.9);
      box-shadow: 0 28px 80px rgba(0,0,0,.42);
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 4px solid rgba(88,148,228,.18);
      border-top-color: #4194ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0; color: #9eb4d1; line-height: 1.5; }
    button {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      background: #287bdc;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <iframe
    id="panel"
    title="Painel JR Gestão"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <div id="loading">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1>JR GESTÃO</h1>
      <p id="message">Conectando ao painel…</p>
      <button id="retry" type="button">TENTAR NOVAMENTE</button>
    </div>
  </div>

  <script>
    const panel = document.getElementById('panel');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');
    const spinner = document.getElementById('spinner');

    let currentTarget = '';
    let fallbackTimer = null;

    function targetFile() {
      return `target.json?v=${Date.now()}`;
    }

    function fail(text) {
      clearTimeout(fallbackTimer);
      loading.classList.remove('hidden');
      spinner.style.display = 'none';
      retry.style.display = 'block';
      message.textContent = text;
    }

    async function openPanel(force = false) {
      retry.style.display = 'none';
      spinner.style.display = 'block';
      loading.classList.remove('hidden');
      message.textContent = 'Conectando ao painel…';

      try {
        const response = await fetch(targetFile(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Destino indisponível');

        const data = await response.json();
        const target = String(data.url || '').trim().replace(/\/+$/, '');

        if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(target)) {
          throw new Error('Túnel inválido');
        }

        if (force || target !== currentTarget || !panel.src) {
          currentTarget = target;
          panel.src = `${target}/`;
        }

        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(() => {
          loading.classList.add('hidden');
        }, 12000);
      } catch {
        fail('O painel está desligado ou ainda está iniciando.');
      }
    }

    panel.addEventListener('load', () => {
      clearTimeout(fallbackTimer);
      setTimeout(() => loading.classList.add('hidden'), 350);
    });

    retry.addEventListener('click', () => openPanel(true));

    setInterval(async () => {
      try {
        const response = await fetch(targetFile(), { cache: 'no-store' });
        if (!response.ok) return;

        const data = await response.json();
        const target = String(data.url || '').trim().replace(/\/+$/, '');

        if (
          /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(target) &&
          target !== currentTarget
        ) {
          currentTarget = target;
          loading.classList.remove('hidden');
          message.textContent = 'Reconectando ao painel…';
          panel.src = `${target}/`;
        }
      } catch {}
    }, 30000);

    openPanel();
  </script>
</body>
</html>
