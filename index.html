<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta name="theme-color" content="#050607">
  <meta name="robots" content="noindex,nofollow">
  <title>JR Gestão</title>

  <link rel="preload" href="./logo-jr-gestao.png?v=48" as="image" type="image/png">

  <style>
    /* JR_GESTAO_WRAPPER_PUBLICADO_V49 */

    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #050607;
      --jr-vh: 100dvh;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050607;
      overscroll-behavior: none;
    }

    body {
      min-height: var(--jr-vh, 100dvh);
    }

    #panel {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: var(--jr-vh, 100dvh);
      border: 0;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      background: #050607;
    }

    /*
      Não existe tela cheia cobrindo o painel.
      É apenas uma barra pequena e não bloqueia toques/cliques.
    */
    #jr-connection-v49 {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      z-index: 30;
      display: grid;
      grid-template-columns: 40px minmax(0,1fr);
      align-items: center;
      width: min(94vw, 440px);
      min-height: 56px;
      padding: 8px 12px 8px 8px;
      border: 1px solid rgba(218,224,227,.22);
      border-radius: 16px;
      color: #eef1f2;
      background: linear-gradient(150deg, rgba(39,43,46,.94), rgba(9,11,13,.95));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 15px 38px rgba(0,0,0,.46);
      transform: translate3d(-50%,0,0);
      transition: opacity .25s ease, visibility .25s ease, transform .25s ease;
      pointer-events: none;
    }

    #jr-connection-v49.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translate3d(-50%,-16px,0);
    }

    #jr-connection-v49.error {
      pointer-events: auto;
    }

    .jr-logo-v49 {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 9px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.36));
    }

    .jr-copy-v49 {
      min-width: 0;
      padding-left: 9px;
    }

    #jr-message-v49 {
      display: block;
      overflow: hidden;
      color: #f5f6f7;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #jr-note-v49 {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: #a1a8ac;
      font-size: 11px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jr-progress-v49 {
      position: absolute;
      right: 12px;
      bottom: 5px;
      left: 57px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0,0,0,.52);
    }

    .jr-progress-v49::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #a7afb3, #f4f6f7, #9aa2a6, transparent);
      transform: translate3d(-120%,0,0);
      animation: jr-progress-v49 1.25s linear infinite;
      -webkit-animation: jr-progress-v49 1.25s linear infinite;
    }

    #jr-retry-v49,
    #jr-direct-v49 {
      display: none;
      min-height: 36px;
      margin-top: 8px;
      border: 1px solid rgba(218,224,227,.24);
      border-radius: 10px;
      color: #f2f4f5;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      background: linear-gradient(145deg, #363b3e, #15181a);
      cursor: pointer;
      touch-action: manipulation;
    }

    #jr-connection-v49.error {
      grid-template-columns: 40px minmax(0,1fr);
    }

    #jr-connection-v49.error #jr-retry-v49,
    #jr-connection-v49.error #jr-direct-v49 {
      display: inline-block;
      pointer-events: auto;
    }

    .jr-actions-v49 {
      display: flex;
      grid-column: 1 / -1;
      gap: 7px;
    }

    .jr-actions-v49 button {
      flex: 1;
    }

    @keyframes jr-progress-v49 {
      0%   { transform: translate3d(-120%,0,0); opacity:.42; }
      45%  { opacity:1; }
      100% { transform: translate3d(340%,0,0); opacity:.46; }
    }

    @media (max-width: 600px) {
      #jr-connection-v49 {
        width: calc(100vw - 16px);
      }
    }
  </style>
</head>
<body>
  <iframe
    id="panel"
    title="Painel JR Gestão"
    allow="clipboard-read;clipboard-write;fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <aside id="jr-connection-v49" role="status" aria-live="polite">
    <img
      class="jr-logo-v49"
      src="./logo-jr-gestao.png?v=48"
      alt=""
      width="1536"
      height="1024"
      decoding="async"
    >

    <div class="jr-copy-v49">
      <span id="jr-message-v49">Conectando ao painel...</span>
      <small id="jr-note-v49">O painel não fica bloqueado durante a conexão</small>
    </div>

    <div class="jr-actions-v49">
      <button id="jr-retry-v49" type="button">TENTAR NOVAMENTE</button>
      <button id="jr-direct-v49" type="button">ABRIR DIRETO</button>
    </div>

    <div class="jr-progress-v49" aria-hidden="true"></div>
  </aside>

  <script>
    (() => {
      'use strict';

      const panel = document.getElementById('panel');
      const status = document.getElementById('jr-connection-v49');
      const message = document.getElementById('jr-message-v49');
      const note = document.getElementById('jr-note-v49');
      const retry = document.getElementById('jr-retry-v49');
      const direct = document.getElementById('jr-direct-v49');

      let currentTarget = '';
      let abortController = null;
      let releaseTimer = 0;
      let loadTimer = 0;

      function updateViewport() {
        const height = Math.round(
          window.visualViewport?.height ||
          window.innerHeight ||
          document.documentElement.clientHeight ||
          800
        );

        document.documentElement.style.setProperty('--jr-vh', `${height}px`);
      }

      function showStatus(main, secondary) {
        status.classList.remove('hidden', 'error');
        message.textContent = main;
        note.textContent = secondary;
      }

      function hideStatus(reason) {
        clearTimeout(releaseTimer);
        clearTimeout(loadTimer);
        status.classList.add('hidden');
        console.info('[JR V49] Aviso removido:', reason);
      }

      function showError(main) {
        clearTimeout(releaseTimer);
        clearTimeout(loadTimer);
        status.classList.remove('hidden');
        status.classList.add('error');
        message.textContent = main;
        note.textContent = 'Tente novamente ou abra o servidor diretamente';
      }

      function validTarget(value) {
        try {
          const url = new URL(String(value || '').trim());
          return url.protocol === 'https:' ? url.href.replace(/\/+$/, '') : '';
        } catch (_error) {
          return '';
        }
      }

      async function fetchTargetOnce() {
        abortController?.abort();
        abortController = new AbortController();

        const timeout = window.setTimeout(
          () => abortController.abort(),
          6500
        );

        try {
          const response = await fetch(
            `./target.json?v=${Date.now()}`,
            {
              cache: 'no-store',
              signal: abortController.signal,
              headers: { Accept: 'application/json' },
            }
          );

          if (!response.ok) throw new Error('target-http');

          const data = await response.json();
          const target = validTarget(data.url);

          if (!target) throw new Error('target-invalid');
          return target;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function fetchTarget() {
        let lastError = null;

        for (let attempt = 1; attempt <= 3; attempt += 1) {
          try {
            return await fetchTargetOnce();
          } catch (error) {
            lastError = error;
            await new Promise((resolve) => setTimeout(resolve, 450 * attempt));
          }
        }

        const cached = validTarget(localStorage.getItem('jr-last-target-v49'));
        if (cached) return cached;

        throw lastError || new Error('target-unavailable');
      }

      async function openPanel(force = false) {
        showStatus(
          force ? 'Buscando o servidor novamente...' : 'Conectando ao painel...',
          'O painel não fica bloqueado durante a conexão'
        );

        try {
          currentTarget = await fetchTarget();
          localStorage.setItem('jr-last-target-v49', currentTarget);

          /*
            O iframe já está visível. Nenhuma camada cobre o painel.
          */
          panel.src = `${currentTarget}/?jr_fixed_link=48&v=${Date.now()}`;

          clearTimeout(releaseTimer);
          releaseTimer = window.setTimeout(
            () => hideStatus('limite máximo de 3 segundos'),
            3000
          );
        } catch (_error) {
          showError('Não foi possível localizar o servidor.');
        }
      }

      panel.addEventListener('load', () => {
        clearTimeout(loadTimer);
        loadTimer = window.setTimeout(
          () => hideStatus('iframe carregado'),
          250
        );
      });

      retry.addEventListener('click', () => openPanel(true));

      direct.addEventListener('click', () => {
        const target =
          validTarget(currentTarget) ||
          validTarget(localStorage.getItem('jr-last-target-v49'));

        if (target) window.open(target, '_blank', 'noopener');
      });

      window.visualViewport?.addEventListener(
        'resize',
        updateViewport,
        { passive: true }
      );

      window.addEventListener(
        'resize',
        updateViewport,
        { passive: true }
      );

      window.addEventListener('orientationchange', () => {
        window.setTimeout(updateViewport, 100);
        window.setTimeout(updateViewport, 380);
      }, { passive: true });

      updateViewport();
      openPanel();
    })();
  </script>
</body>
</html>
